<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <title>deej - a hardware volume mixer for Windows and Linux</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17143a"/>
    </linearGradient>
    <!-- deej's logo colours (assets/logo.svg) -->
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="300">
      <stop offset="0" stop-color="#4776e6"/>
      <stop offset="1" stop-color="#8e54e9"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4776e6"/>
      <stop offset="1" stop-color="#8e54e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a63e8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6a63e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>

  <!-- soft glow behind the faders -->
  <ellipse cx="252" cy="180" rx="230" ry="170" fill="url(#glow)"/>

  <!-- the icon: five faders drawn like the ones in deej's logo, one per knob of a 5-knob build -->
  <g stroke="url(#brand)" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="140" y1="72" x2="140" y2="288"/>
    <line x1="196" y1="72" x2="196" y2="288"/>
    <line x1="252" y1="72" x2="252" y2="288"/>
    <line x1="308" y1="72" x2="308" y2="288"/>
    <line x1="364" y1="72" x2="364" y2="288"/>
  </g>
  <g stroke="url(#brand)" stroke-width="9" fill="#120f2c">
    <circle cx="140" cy="214" r="22"/>
    <circle cx="196" cy="128" r="22"/>
    <circle cx="252" cy="176" r="22"/>
    <circle cx="308" cy="104" r="22"/>
    <circle cx="364" cy="236" r="22"/>
  </g>

  <text x="460" y="176" fill="#f5f5f7" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-2">deej</text>
  <text x="463" y="230" fill="#aeb4cc" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="32">A hardware volume mixer for your PC.</text>

  <rect x="465" y="270" width="96" height="6" rx="3" fill="url(#dash)"/>
  <text x="585" y="279" fill="#7f86a3" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="22">Windows · Linux · Arduino · knobs, sliders and screens</text>
</svg>
