name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        mode: [release, dev]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build scripts embed `git describe`, which needs the tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # no system packages needed: the Linux build is pure Go (CGO_ENABLED=0 in the build scripts)

      - name: Test
        if: matrix.mode == 'release'
        run: go test ./pkg/deej/

      - name: Build deej (Windows)
        if: runner.os == 'Windows'
        run: pkg/deej/scripts/windows/build-${{ matrix.mode }}.bat
        shell: cmd

      - name: Build deej (Linux)
        if: runner.os == 'Linux'
        run: pkg/deej/scripts/linux/build-${{ matrix.mode }}.sh

      - name: Upload build
        if: matrix.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: deej-${{ runner.os }}
          path: |
            deej-release.exe
            deej-release
            config.yaml
          if-no-files-found: error
