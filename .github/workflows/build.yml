# Builds and tests deej, and compiles the Arduino sketches, on every push and pull request.
# On a version tag (v1.2.3) it also publishes a GitHub Release with the downloads, checksums,
# third-party notices and release notes taken from the README's changelog.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Builds only read the repository; the release job asks for write access itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: go run ./tools/release --check "${GITHUB_REF_NAME#v}"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi

      - name: Vet (Windows and Linux code)
        run: |
          GOOS=windows go vet ./...
          GOOS=linux go vet ./...

      - name: Test
        run: go test ./...

      - name: Check third-party notices are current
        run: |
          go run ./tools/notices
          git diff --exit-code THIRD-PARTY-NOTICES.txt

      - name: Build
        run: |
          mkdir -p dist
          flags="-s -w -X main.buildType=release -X main.gitCommit=${GITHUB_SHA::7}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$flags -H=windowsgui" -o dist/deej.exe ./pkg/deej/cmd
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$flags" -o dist/deej-linux-amd64 ./pkg/deej/cmd
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$flags" -o dist/deej-linux-arm64 ./pkg/deej/cmd
          cp config.yaml THIRD-PARTY-NOTICES.txt dist/

      - uses: actions/upload-artifact@v7
        with:
          name: deej
          path: dist/*

  # Compiles every sketch in arduino/ for an Arduino Nano, so a firmware change that doesn't build
  # (or no longer fits in flash) fails here instead of when someone flashes it. The core and
  # library versions are pinned; bump them on purpose.
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the AVR core and U8g2
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install U8g2@2.36.19

      - name: Compile the sketches
        run: |
          for sketch in arduino/*/; do
            echo "::group::$sketch"
            arduino-cli compile --fqbn arduino:avr:nano --warnings default "$sketch"
            echo "::endgroup::"
          done

  # On a version tag (v1.2.3): publish a GitHub Release with every download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          name: deej
          path: release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Write release notes
        run: go run ./tools/release "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # a re-pushed tag updates its existing release: same page, new files and notes
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "deej ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "deej ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
